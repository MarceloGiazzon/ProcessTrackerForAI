name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add clippy
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # The README promises "under 1 MB"; fail here, not at release time.
      - name: Binary size
        shell: bash
        run: |
          cargo build --release
          f=target/release/ptrack
          [ -f "$f.exe" ] && f="$f.exe"
          size=$(wc -c < "$f")
          echo "$f: $size bytes (limit: 1048576)"
          [ "$size" -le 1048576 ]
