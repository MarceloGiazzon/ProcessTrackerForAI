<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ptrack jobs</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6ec;
    --running: #1d63d8; --paused: #b26a00; --passed: #1a7f45; --failed: #c4302b;
    --cancelled: #667085; --lost: #8a3ffc; --code-bg: #0f1420; --code-text: #d7dce6;
    --btn: #eef1f5; --btn-hover: #e2e6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171b23; --text: #e6e9ef; --muted: #98a1b3; --line: #262c38;
      --running: #6aa4ff; --paused: #f0b04a; --passed: #4cc287; --failed: #ff6b63;
      --cancelled: #98a1b3; --lost: #b48cff; --code-bg: #0a0d13; --code-text: #d7dce6;
      --btn: #232936; --btn-hover: #2d3444;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .counts { color: var(--muted); }
  .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--passed); }
  .live.off .dot { background: var(--failed); }
  label.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 40px; }
  .notice { padding: 14px 16px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; }
  .job {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 10px; overflow: hidden;
  }
  .row {
    display: grid; grid-template-columns: 18px 96px 1fr auto; gap: 4px 14px; align-items: center;
    padding: 12px 14px; cursor: pointer;
  }
  .row input[type=checkbox], .bar input[type=checkbox] { width: 16px; height: 16px; margin: 0; cursor: pointer; }
  .job.selected { border-color: var(--running); }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px;
    padding: 8px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .bar label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .bar .picked { color: var(--muted); }
  .row:hover { background: color-mix(in srgb, var(--btn) 50%, transparent); }
  .badge {
    display: inline-block; text-align: center; font-size: 12px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px; color: var(--state);
    background: color-mix(in srgb, var(--state) 14%, transparent);
  }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project { font-weight: 600; color: var(--text); }
  .tag {
    display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; margin-right: 6px;
    border-radius: 5px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px;
  }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .last {
    grid-column: 3 / 5; color: var(--muted); font: 12.5px/1.4 ui-monospace, Consolas, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .actions { display: flex; gap: 6px; }
  button {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--btn); color: var(--text);
  }
  button:hover { background: var(--btn-hover); }
  select {
    font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 7px; max-width: 180px;
    border: 1px solid var(--line); background: var(--btn); color: var(--text);
  }
  button.danger { color: var(--failed); }
  button:disabled { opacity: 0.5; cursor: default; }
  .log { border-top: 1px solid var(--line); }
  .log-head { display: flex; gap: 12px; align-items: center; padding: 8px 14px; color: var(--muted); font-size: 12.5px; }
  .log-head span { white-space: nowrap; }
  .log-head code { overflow-wrap: anywhere; }
  pre {
    margin: 0; padding: 12px 14px; max-height: 420px; overflow: auto; background: var(--code-bg);
    color: var(--code-text); font: 12.5px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .row { grid-template-columns: 18px 1fr auto; }
    .row .badge { justify-self: start; }
    .row > .info { grid-column: 1 / 4; }
    .last { grid-column: 1 / 4; }
    .actions { grid-column: 3; grid-row: 1; }
  }
</style>
</head>
<body>
<header>
  <h1>ptrack</h1>
  <span class="counts" id="counts"></span>
  <span class="spacer"></span>
  <select id="project" aria-label="Filter by project"><option value="">All projects</option></select>
  <select id="tag" aria-label="Filter by tag" hidden><option value="">All tags</option></select>
  <label class="toggle"><input type="checkbox" id="all"> Show older jobs</label>
  <label class="toggle" title="Show a notification on this computer when a job finishes (while this page is open)"><input type="checkbox" id="notify"> Notify when jobs end</label>
  <span class="live" id="live"><span class="dot"></span><span id="live-text">live</span></span>
</header>
<main>
  <div class="bar" id="bar" hidden>
    <label><input type="checkbox" id="pick-all"> Select all</label>
    <span class="picked" id="picked"></span>
    <span class="spacer"></span>
    <button id="expand" title="Open the output of every job on screen">Expand all</button>
    <button id="collapse" title="Close every open output">Collapse all</button>
    <select id="scope" aria-label="How much output Copy and Download include">
      <option value="all">Full log</option>
      <option value="5000">Last 5000 lines</option>
    </select>
    <button id="copy" title="Copy the details and output of the selected jobs, like Ctrl+C">Copy selected</button>
    <button id="download" title="Merge the selected jobs into one text file and download it">Download selected</button>
  </div>
  <div id="jobs"></div>
  <footer id="footer"></footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const params = new URLSearchParams(location.hash.slice(1));
const token = params.get("t") || "";
const $ = (id) => document.getElementById(id);
// Several jobs can be open at once; each keeps its own log panel state.
const openJobs = new Set(params.get("job") ? [params.get("job")] : []);
const logs = new Map();   // job id -> { text, final, top, stick }
const selected = new Set();   // job ids ticked for Copy / Download
// Each open job that is still running re-reads its log every refresh, so
// "Expand all" stops at this many.
const MAX_EXPAND = 20;
let shown = [];   // jobs on screen now, in order
let showAll = false;
try { showAll = localStorage.getItem("ptrack.all") === "1"; } catch (e) {}
$("all").checked = showAll;
// How much of each log Copy / Download take, remembered like "Show older jobs".
try { $("scope").value = localStorage.getItem("ptrack.scope") || "all"; } catch (e) {}
$("scope").addEventListener("change", (e) => {
  try { localStorage.setItem("ptrack.scope", e.target.value); } catch (err) {}
});
// Project and tag filters, remembered per browser like "Show older jobs".
// A link to one job (`ptrack ui --job ID`) ignores them, so that job is shown.
const filters = { project: "", tag: "" };
try {
  if (!openJobs.size) {
    filters.project = localStorage.getItem("ptrack.project") || "";
    filters.tag = localStorage.getItem("ptrack.tag") || "";
  }
} catch (e) {}

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null) n.append(c instanceof Node ? c : String(c));
  return n;
}

function dur(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0") + "s";
  if (s < 86400) return Math.floor(s / 3600) + "h" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "m";
  return Math.floor(s / 86400) + "d" + String(Math.floor(s % 86400 / 3600)).padStart(2, "0") + "h";
}

function api(path, opts) {
  return fetch(path, Object.assign({ headers: { "X-Ptrack-Token": token } }, opts || {}));
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 3500);
}

async function act(job, action, button) {
  if (action === "stop" && !confirm("Stop job " + job.id + " and everything it started?")) return;
  if (action === "rerun" && !confirm("Run this again in " + job.cwd + "?\n\n" + title(job))) return;
  button.disabled = true;
  try {
    const r = await api("/api/jobs/" + job.id + "/" + action, { method: "POST" });
    const body = await r.json();
    toast(body.message);
  } catch (e) {
    toast("Could not reach ptrack: " + e.message);
  }
  refresh();
}

function title(j) {
  if (j.label) return j.label;
  return j.command.map((a) => /\s/.test(a) || a === "" ? '"' + a + '"' : a).join(" ");
}

function renderJob(j) {
  const active = j.state === "running" || j.state === "paused";
  const meta = el("div", { class: "meta" },
    j.project ? el("span", { class: "project", title: j.cwd }, j.project) : null,
    el("span", {}, "#" + j.id),
    el("span", {}, ({ running: "running for ", paused: "up for " }[j.state] || "took ") + dur(j.duration_ms)),
    el("span", {}, "started " + dur(Date.now() - j.started_ms) + " ago"),
    j.agent ? el("span", {}, "by " + j.agent.split("_")[0]) : null,
    j.exit_code != null ? el("span", {}, "exit " + j.exit_code) : null,
    j.rerun_of ? el("span", {}, "rerun of #" + j.rerun_of) : null,
  );
  const actions = el("div", { class: "actions" });
  if (j.state === "running") {
    actions.append(el("button", { onclick: (e) => { e.stopPropagation(); act(j, "pause", e.target); } }, "Pause"));
  }
  if (j.state === "paused") {
    actions.append(el("button", { onclick: (e) => { e.stopPropagation(); act(j, "resume", e.target); } }, "Resume"));
  }
  if (active) {
    actions.append(el("button", { class: "danger", onclick: (e) => { e.stopPropagation(); act(j, "stop", e.target); } }, "Stop"));
  } else {
    actions.append(el("button", { onclick: (e) => { e.stopPropagation(); act(j, "rerun", e.target); } }, "Rerun"));
  }
  const toggle = () => {
    if (openJobs.delete(j.id)) logs.delete(j.id);
    else openJobs.add(j.id);
    refresh();
  };
  const check = el("input", {
    type: "checkbox", "aria-label": "Select job " + j.id,
    onclick: (e) => e.stopPropagation(),
    onchange: (e) => { setSelected(j.id, e.target.checked); e.target.closest(".job").classList.toggle("selected", e.target.checked); },
  });
  check.checked = selected.has(j.id);
  const row = el("div", { class: "row", onclick: toggle },
    check,
    el("span", { class: "badge", style: "--state: var(--" + j.state + ")" }, j.state),
    el("div", { class: "info" }, el("div", { class: "title", title: title(j) }, j.tag ? el("span", { class: "tag" }, j.tag) : null, title(j)), meta),
    actions,
    j.last_line ? el("div", { class: "last", title: j.last_line }, j.last_line) : null,
  );
  const card = el("div", { class: "job" + (selected.has(j.id) ? " selected" : "") }, row);
  if (openJobs.has(j.id)) {
    if (!logs.has(j.id)) logs.set(j.id, { text: "", final: false, top: 0, stick: true });
    const view = logs.get(j.id);
    const pre = el("pre", { "data-id": j.id }, view.text || "loading…");
    card.append(el("div", { class: "log" },
      el("div", { class: "log-head" }, el("span", {}, "Last 200 lines"), el("code", {}, j.log_path)),
      pre));
    if (view.final) return card;
    api("/api/jobs/" + j.id + "/log?lines=200").then((r) => r.text()).then((text) => {
      if (!logs.has(j.id)) return;   // closed while loading
      Object.assign(view, { text: text || "(no output yet)", final: !active });
      const live = logPanel(j.id);
      if (!live) return;
      live.textContent = view.text;
      live.scrollTop = view.stick ? live.scrollHeight : view.top;
    });
  }
  return card;
}

function logPanel(id) {
  return [...document.querySelectorAll("pre[data-id]")].find((p) => p.dataset.id === id);
}

// Log panel state survives the periodic redraw: text, and scroll position
// (sticks to the bottom unless the reader scrolled up).
function rememberLogScroll() {
  for (const pre of document.querySelectorAll("pre[data-id]")) {
    const view = logs.get(pre.dataset.id);
    if (!view) continue;
    view.top = pre.scrollTop;
    view.stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
  }
}

function restoreLogScroll() {
  for (const pre of document.querySelectorAll("pre[data-id]")) {
    const view = logs.get(pre.dataset.id);
    if (view) pre.scrollTop = view.stick ? pre.scrollHeight : view.top;
  }
}

// Selection: the bar's "Select all" covers the jobs on screen.
function setSelected(id, on) {
  if (on) selected.add(id); else selected.delete(id);
  updateBar();
}

function updateBar() {
  const n = shown.filter((j) => selected.has(j.id)).length;
  $("bar").hidden = shown.length === 0;
  const all = $("pick-all");
  all.checked = shown.length > 0 && n === shown.length;
  all.indeterminate = n > 0 && n < shown.length;
  $("picked").textContent = n ? n + " of " + shown.length + " selected" : "";
  $("copy").disabled = $("download").disabled = n === 0;
  $("expand").disabled = shown.every((j) => openJobs.has(j.id));
  $("collapse").disabled = openJobs.size === 0;
}

$("expand").addEventListener("click", () => {
  const closed = shown.filter((j) => !openJobs.has(j.id));
  for (const j of closed.slice(0, MAX_EXPAND)) openJobs.add(j.id);
  if (closed.length > MAX_EXPAND) toast("Opened the first " + MAX_EXPAND + " of " + closed.length + " closed jobs.");
  refresh();
});

// Also closes jobs that a filter hides, so nothing stays open out of sight.
$("collapse").addEventListener("click", () => {
  openJobs.clear();
  logs.clear();
  refresh();
});

$("pick-all").addEventListener("change", (e) => {
  for (const j of shown) {
    if (e.target.checked) selected.add(j.id); else selected.delete(j.id);
  }
  for (const card of document.querySelectorAll(".job")) {
    const box = card.querySelector(".row input[type=checkbox]");
    if (box) { box.checked = e.target.checked; card.classList.toggle("selected", e.target.checked); }
  }
  updateBar();
});

// One text for the selected jobs: a short header per job, then its output
// (the whole log, or the last 5000 lines; the server sends at most the last 32 MB).
async function selectedText() {
  const picked = shown.filter((j) => selected.has(j.id));
  const lines = $("scope").value === "5000" ? "5000" : "all";
  const parts = await Promise.all(picked.map(async (j) => {
    let text = "(log unavailable)";
    let note = null;
    try {
      const r = await api("/api/jobs/" + j.id + "/log?lines=" + lines);
      if (r.ok) {
        text = (await r.text()) || "(no output)";
        if (r.headers.get("X-Ptrack-Truncated") === "1") note = "(log truncated: only the last 32 MB are included)";
      }
    } catch (e) {}
    return [
      "=== job " + j.id + ": " + title(j) + " ===",
      "state: " + j.state + (j.exit_code != null ? " (exit " + j.exit_code + ")" : "") + " · took " + dur(j.duration_ms),
      "folder: " + j.cwd,
      "started: " + new Date(j.started_ms).toISOString(),
      "log: " + j.log_path,
      ...(note ? [note] : []),
      "",
      text,
    ].join("\n");
  }));
  return parts.join("\n\n") + "\n";
}

async function copyText(textPromise) {
  // Safari only allows the copy if it starts inside the click, so hand it the promise.
  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
    try {
      await navigator.clipboard.write([new ClipboardItem({
        "text/plain": textPromise.then((t) => new Blob([t], { type: "text/plain" })),
      })]);
      return;
    } catch (e) {}
  }
  const text = await textPromise;
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const area = el("textarea", { style: "position:fixed;opacity:0" });
    area.value = text;
    document.body.append(area);
    area.select();
    const ok = document.execCommand("copy");
    area.remove();
    if (!ok) throw new Error("the browser refused to copy");
  }
}

$("copy").addEventListener("click", async () => {
  const count = shown.filter((j) => selected.has(j.id)).length;
  try {
    await copyText(selectedText());
    toast("Copied " + count + " job" + (count === 1 ? "" : "s") + " to the clipboard.");
  } catch (e) {
    toast("Could not copy: " + e.message);
  }
});

$("download").addEventListener("click", async () => {
  const count = shown.filter((j) => selected.has(j.id)).length;
  const text = await selectedText();
  const link = el("a", {
    href: URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" })),
    download: "ptrack-jobs-" + new Date().toISOString().slice(0, 19).replace(/[-:]/g, "").replace("T", "-") + ".txt",
  });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 10000);
  toast("Downloaded " + count + " job" + (count === 1 ? "" : "s") + ".");
});

let inFlight = false;
async function refresh() {
  if (inFlight) return;
  inFlight = true;
  try {
    if (!token) {
      $("jobs").replaceChildren(el("div", { class: "notice" },
        "Open this page with the link printed by ", el("code", {}, "ptrack ui"), " (it includes an access key)."));
      return;
    }
    const q = new URLSearchParams();
    if (showAll) q.set("all", "1");
    if (filters.project) q.set("project", filters.project);
    if (filters.tag) q.set("tag", filters.tag);
    const r = await api("/api/jobs" + (q.toString() ? "?" + q : ""));
    if (r.status === 401) throw new Error("access key not accepted; reopen the link from ptrack ui");
    const data = await r.json();
    notifyFinished(data.jobs);
    fillSelect("project", "All projects", data.projects || [], filters.project);
    fillSelect("tag", "All tags", data.tags || [], filters.tag);
    const running = data.jobs.filter((j) => j.state === "running").length;
    const paused = data.jobs.filter((j) => j.state === "paused").length;
    $("counts").textContent = running + " running" + (paused ? ", " + paused + " paused" : "");
    document.title = (running ? "(" + running + ") " : "") + "ptrack jobs";
    const list = data.jobs.length
      ? data.jobs.map(renderJob)
      : filters.project || filters.tag
        ? [el("div", { class: "notice" }, "No jobs match this project or tag. Choose \"All\" in the filters to see every job.")]
        : [el("div", { class: "notice" }, "No jobs yet. Start one with: ", el("code", {}, "ptrack run -d -- <command>"))];
    shown = data.jobs;
    // Forget ticks on jobs that are no longer listed (filtered out or pruned),
    // so Copy / Download never include something the user can't see.
    for (const id of [...selected]) if (!shown.some((j) => j.id === id)) selected.delete(id);
    rememberLogScroll();
    $("jobs").replaceChildren(...list);
    restoreLogScroll();
    updateBar();
    const hidden = data.total - data.jobs.length;
    $("footer").textContent = (hidden > 0 ? hidden + " older job(s) hidden · " : "") + "Data folder: " + data.home;
    $("live").classList.remove("off");
    $("live-text").textContent = "live";
  } catch (e) {
    $("live").classList.add("off");
    $("live-text").textContent = "offline";
    if (!$("jobs").children.length) $("jobs").replaceChildren(el("div", { class: "notice" }, e.message));
  } finally {
    inFlight = false;
  }
}

// Rebuilds a filter's options only when the list changed, so the periodic
// refresh doesn't close a dropdown the user has open.
function fillSelect(id, allLabel, values, current) {
  const sel = $(id);
  const options = [""].concat(values);
  if (current && !values.includes(current)) options.push(current);
  const key = JSON.stringify(options);
  sel.hidden = options.length === 1;
  if (sel.dataset.key === key) return;
  sel.dataset.key = key;
  sel.replaceChildren(...options.map((v) => el("option", { value: v }, v || allLabel)));
  sel.value = current;
}

for (const k of ["project", "tag"]) {
  $(k).addEventListener("change", (e) => {
    filters[k] = e.target.value;
    try { localStorage.setItem("ptrack." + k, filters[k]); } catch (err) {}
    refresh();
  });
}

$("all").addEventListener("change", (e) => {
  showAll = e.target.checked;
  try { localStorage.setItem("ptrack.all", showAll ? "1" : "0"); } catch (err) {}
  refresh();
});

// Browser notifications when a job this page saw running has ended.
// Works only while the page is open; the setting is remembered per browser.
const seenStates = new Map();
let firstLoad = true;
let notifyOn = false;
try { notifyOn = localStorage.getItem("ptrack.notify") === "1"; } catch (e) {}
const canNotify = "Notification" in window;
$("notify").checked = notifyOn && canNotify && Notification.permission === "granted";
$("notify").disabled = !canNotify;

$("notify").addEventListener("change", async (e) => {
  notifyOn = e.target.checked;
  if (notifyOn && Notification.permission !== "granted") {
    // Must be asked from a click; browsers block it otherwise.
    const answer = await Notification.requestPermission();
    if (answer !== "granted") {
      notifyOn = false;
      e.target.checked = false;
      toast("Notifications are blocked for this page in your browser settings.");
    }
  }
  try { localStorage.setItem("ptrack.notify", notifyOn ? "1" : "0"); } catch (err) {}
});

function notifyFinished(jobs) {
  for (const j of jobs) {
    const before = seenStates.get(j.id);
    const wasActive = before === "running" || before === "paused";
    const isActive = j.state === "running" || j.state === "paused";
    if (!firstLoad && wasActive && !isActive && notifyOn && canNotify && Notification.permission === "granted") {
      const body = "took " + dur(j.duration_ms)
        + (j.exit_code != null ? " · exit " + j.exit_code : "")
        + (j.last_line ? "\n" + j.last_line : "");
      const n = new Notification(title(j) + ": " + j.state, { body: body, tag: "ptrack-" + j.id });
      n.onclick = () => { window.focus(); openJobs.add(j.id); refresh(); n.close(); };
    }
    seenStates.set(j.id, j.state);
  }
  firstLoad = false;
}

refresh();
setInterval(refresh, 1500);
</script>
